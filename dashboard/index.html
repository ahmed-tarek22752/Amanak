<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amanak | أمانك</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #1d2736;
        --muted: #5d6a7a;
        --primary: #1f9d8d;
        --warning: #f2a93b;
        --danger: #d94d4d;
        --safe: #2d9b68;
        --shadow: rgba(15, 23, 42, 0.08);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Tahoma, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }
      .brand {
        font-size: 2rem;
        font-weight: 700;
        color: var(--primary);
      }
      .toggle {
        background: var(--card);
        border: 1px solid #dfe7ef;
        border-radius: 999px;
        padding: 8px 14px;
        cursor: pointer;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        margin: 20px 0 28px;
      }
      .card {
        background: var(--card);
        border-radius: 18px;
        box-shadow: 0 8px 20px var(--shadow);
        padding: 18px 20px;
      }
      .label {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .value {
        font-size: 1.9rem;
        font-weight: 700;
        margin-top: 8px;
      }
      .chart-box {
        background: var(--card);
        border-radius: 18px;
        box-shadow: 0 8px 20px var(--shadow);
        padding: 20px;
      }
      .chart-box h3 {
        margin: 0 0 14px;
      }
      .bars {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        height: 180px;
        margin-top: 12px;
      }
      .bar {
        flex: 1;
        background: linear-gradient(180deg, #52b3a7, #1f9d8d);
        border-radius: 10px 10px 0 0;
        min-height: 10px;
        position: relative;
      }
      .bar-label {
        position: absolute;
        bottom: -22px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.72rem;
        color: var(--muted);
        white-space: nowrap;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 18px;
      }
      .table th, .table td {
        text-align: right;
        padding: 10px 8px;
        border-bottom: 1px solid #e7edf3;
      }
      .muted {
        color: var(--muted);
      }
      @media (max-width: 600px) {
        .topbar { flex-direction: column; gap: 12px; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <div class="brand">Amanak | أمانك</div>
        <button class="toggle" id="langToggle">English</button>
      </div>

      <div class="cards">
        <div class="card">
          <div class="label">إجمالي الفحوصات</div>
          <div class="value" id="totalChecks">0</div>
        </div>
        <div class="card">
          <div class="label">نصب</div>
          <div class="value" id="scamCount">0</div>
        </div>
        <div class="card">
          <div class="label">تحذير</div>
          <div class="value" id="cautionCount">0</div>
        </div>
        <div class="card">
          <div class="label">سليم</div>
          <div class="value" id="safeCount">0</div>
        </div>
      </div>

      <div class="chart-box">
        <h3 id="dailyTitle">الفحوصات في آخر 30 يوم</h3>
        <div class="bars" id="dailyBars"></div>
      </div>

      <div class="chart-box" style="margin-top: 24px;">
        <h3>أعلى أنواع النصب</h3>
        <table class="table">
          <thead>
            <tr>
              <th>النوع</th>
              <th>العدد</th>
            </tr>
          </thead>
          <tbody id="topTypes"></tbody>
        </table>
      </div>
    </div>

    <script>
      const langToggle = document.getElementById('langToggle');
      let english = false;
      const translations = {
        ar: 'English',
        en: 'العربية'
      };
      langToggle.addEventListener('click', () => {
        english = !english;
        langToggle.textContent = translations[english ? 'en' : 'ar'];
        document.documentElement.lang = english ? 'en' : 'ar';
        document.documentElement.dir = english ? 'ltr' : 'rtl';
      });

      async function loadStats() {
        const response = await fetch('/api/stats');
        const stats = await response.json();
        document.getElementById('totalChecks').textContent = stats.total_checks ?? 0;
        document.getElementById('scamCount').textContent = stats.scams_caught ?? 0;
        document.getElementById('cautionCount').textContent = stats.cautions ?? 0;
        document.getElementById('safeCount').textContent = stats.safe ?? 0;

        const bars = document.getElementById('dailyBars');
        bars.innerHTML = '';
        if (stats.checks_per_day && stats.checks_per_day.length) {
          const maxValue = Math.max(...stats.checks_per_day.map(d => d.count), 1);
          stats.checks_per_day.slice().reverse().forEach(item => {
            const bar = document.createElement('div');
            bar.className = 'bar';
            const height = (item.count / maxValue) * 100;
            bar.style.height = height + '%';
            const label = document.createElement('span');
            label.className = 'bar-label';
            label.textContent = item.date.slice(5);
            bar.appendChild(label);
            bars.appendChild(bar);
          });
        }

        const types = document.getElementById('topTypes');
        types.innerHTML = '';
        (stats.top_scam_types || []).forEach(item => {
          const row = document.createElement('tr');
          row.innerHTML = `<td>${item.name}</td><td>${item.count}</td>`;
          types.appendChild(row);
        });
      }

      loadStats();
    </script>
  </body>
</html>
